plugins {
	// 1.20.x and 1.21.x use Mojang's mappings and need remapping.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

def target = providers.gradleProperty('minecraft_target').getOrElse(project.minecraft_version)
def targets = new Properties()
file('gradle/minecraft.properties').withInputStream { targets.load(it) }
def dependenciesForTarget = targets.getProperty(target)
if (dependenciesForTarget == null) throw new GradleException("Unsupported Minecraft version: $target")
def (apiVersion, menuVersion, javaVersion, minimumLoader) = dependenciesForTarget.split(',')
ext.minecraft_version = target
ext.minecraft_dependency = target
ext.minecraft_label = target
ext.fabric_api_version = apiVersion
ext.modmenu_version = menuVersion
def targetJava = javaVersion.toInteger()
def clientTests = target == '1.21.11'
def legacyScreen = target in ['1.20', '1.20.1']

version = "${mod_version}+${minecraft_label}"
group = project.maven_group

repositories {
	maven {
		url = 'https://maven.nucleoid.xyz/'
		content {
			includeGroup 'eu.pb4'
		}
	}
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"smallhands" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

if (legacyScreen) {
	sourceSets.client.java.srcDir 'src/legacy/java'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def props = [version: project.version, minecraft_dependency: project.minecraft_dependency, java_version: targetJava, loader_dependency: minimumLoader,
		modmenu_entrypoint: legacyScreen ? 'net.sallylabs.LegacySmallhandsModMenu' : 'net.sallylabs.SmallhandsModMenu']
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

processClientResources {
	inputs.property 'java_version', targetJava
	filesMatching('smallhands.client.mixins.json') {
		expand java_version: targetJava
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = targetJava
	it.options.encoding = "UTF-8"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(targetJava)
	}

	sourceCompatibility = JavaVersion.toVersion(targetJava)
	targetCompatibility = JavaVersion.toVersion(targetJava)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
